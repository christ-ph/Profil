<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/8695b27503.js" crossorigin="anonymous"></script>
</head>
<body>

    <article class="card">
        <!-- Image de fond (dégradé) -->
        <figure class="bg-img">
            <img src="image.png" alt="background">
        </figure>

        <!-- Photo de profil qui chevauche -->
        <figure class="profile-img">
            <img src="profile.jpeg" alt="profile picture">
        </figure>

        <!-- Infos -->
        <section class="profile-info">
            <h2 class="profile-name">Christ Dadjo</h2>
            <p class="profile-bio">
                Lorem ipsum dolor sit, amet consectetur adipisicing elit.
                Quae natus sed dolor nihil quam voluptas suscipit sequi,
                iusto quia quidem voluptates necessitatibus magnam et
                saepe tenetur earum sunt fugit impedit?
            </p>
        </section>

        <!-- Réseaux sociaux (dans la carte) -->
        <nav class="social-links">
            <a href="#" class="fa-brands fa-facebook" aria-label="Facebook"></a>
            <a href="#" class="fa-brands fa-instagram" aria-label="Instagram"></a>
            <a href="#" class="fa-brands fa-whatsapp" aria-label="WhatsApp"></a>
            <a href="#" class="fa-brands fa-linkedin" aria-label="LinkedIn"></a>
        </nav>
    </article>

</body>
</html>
